<!DOCTYPE html>
<html lang="en-AU" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('This link is no longer valid')}"></head>
<body>
<main>
    <h1>This link is no longer valid</h1>
    <p th:if="${reason == 'USED'}">It has already been used to confirm an ORCID iD.</p>
    <p th:if="${reason == 'EXPIRED'}">It has expired.</p>
    <p th:if="${reason == 'UNKNOWN'}">We don't recognise it. Check that you opened the whole link from the email.</p>
    <p>If you still want to confirm your ORCID iD for a project, ask the person who added you to the project, or
        email <a th:href="'mailto:' + ${contactEmail}" th:text="${contactEmail}">contact</a>.</p>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
