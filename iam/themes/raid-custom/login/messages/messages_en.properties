# Message keys for the RAiD login page (RAID-1068).
#
# Every piece of text and every link on the login page comes from a key here,
# so a realm can change it under Realm settings > Localization > Realm
# overrides, with no theme change. A realm override beats the value in this
# file. The defaults here are neutral: they name no agency, and a link or text
# left empty is simply not shown. ardc-branding supplies ARDC's values.
#
# Values go through Java MessageFormat: write a literal apostrophe as '' and
# avoid braces. See iam/doc/login-page-configuration.md for what each key does.

# Page title and accessibility text
pageTitle=RAiD Sign-in
logoAlt=RAiD logo
strapLineAlt=RAiD - Research Activity Identifier
loadingLogoAlt=RAiD
navToggleLabel=Toggle navigation menu

# Header: the title beside the logo, and the links on the right (ardc-branding)
welcomeTitle=
megaMenuHost=RAiD App
headerLinkAboutText=
headerLinkAboutUrl=
headerLinkDocsText=
headerLinkDocsUrl=
headerLinkRaidText=
headerLinkRaidUrl=

# Text under the sign-in card. HTML links are allowed.
welcomeText=

# Sign-in card
signinTitle=RAiD Sign-in
signinText=Please select your preferred sign-in method

# Sign-in footnote: "By signing in you agree to the <service policy> and <privacy policy>."
# servicePolicy and privacyPolicy are HTML links. The footnote is left out when both are empty.
signinFootnotePrefix=By signing in you agree to the
signinFootnoteJoin=and
signinFootnoteSuffix=.
servicePolicy=
privacyPolicy=

# Sign-in provider helper text
idp.aaf.helperText=Australian universities and research organisations.
idp.orcid.helperText=Recommended for international users.
idp.google.helperText=For users without an institutional or ORCID account.

# Sign-in loading/redirecting state
idp.aaf.loadingTitle=Redirecting to your institution…
idp.aaf.loadingText=You''ll sign in through the Australian Access Federation, then return to RAiD.
idp.orcid.loadingTitle=Redirecting to ORCID…
idp.orcid.loadingText=You''ll sign in through ORCID, then return to RAiD.
idp.google.loadingTitle=Redirecting to Google…
idp.google.loadingText=You''ll sign in through Google, then return to RAiD.
loadingCancelLink=Taking too long? Cancel and choose another option

# Sign-in help disclosure
signinHelpToggle=Which sign-in option is right for me?
signinHelpText=<p>If you have an account with an Australian university or research organisation, choose Australian Access Federation. If you''re an international researcher, choose ORCID. Otherwise, choose Google.</p>

