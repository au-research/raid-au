raid:
  environment: not-set
  repository-client:
    username: not-set
    password: not-set
    url: https://api.test.datacite.org/repositories
    email: not-set
  iam:
    realm-uri: https://iam.${raid.environment}.raid.org.au/realms/raid
  db:
    name: raido
  isni-client:
    url-format: https://isni.oclc.org/sru/?query=pica.isn+%3D+%22__ISNI__%22&operation=searchRetrieve&recordSchema=isni-b
  orcid-client:
    base-url: https://api.sandbox.orcid.org/v3.0/
    access-token: not-set
  ror-client:
    client-id: 08VB3D1YYHC63CQ8QHP0TBD0I6RULCHQ
    base-url: https://api.ror.org/v2/
  cors:
    origins:
      - http://localhost:7080
  contributor-validation:
    orcid:
      url-prefix: https://orcid.org/
      schema-uri: https://orcid.org/
    isni:
      url-prefix: https://isni.org/
      schema-uri: https://isni.org/
  orcid-integration:
    orcid-url-prefix: https://sandbox.orcid.org/
    host: http://localhost:1080
    raid-listener:
      uri: ${raid.orcid-integration.host}/raid-update
    contributor-id-lookup:
      uri: ${raid.orcid-integration.host}/find-contributor-by-orcid
    api-key: not-set
  stub:
    geo-names:
      enabled: false
      delay: 150
    orcid:
      enabled: false
      delay: 150
    apids:
      enabled: false
      delay: 150
    doi:
      enabled: false
      delay: 150
    handle:
      enabled: false
      delay: 150
    rrid:
      enabled: false
      delay: 150
    open-street-map:
      enabled: false
      delay: 150
    isni:
      enabled: false
      delay: 150
    ror:
      enabled: false
      delay: 150
    web-archive:
      enabled: false
      delay: 150
    ark:
      enabled: false
      delay: 150
  identifier:
    schema-uri: https://raid.org/
    license: Creative Commons CC-0
    landing-prefix: https://static.${raid.environment}.raid.org.au/raids/
    registration-agency-identifier: https://ror.org/038sjwq14
    name-prefix: https://raid.org/
  spatial-coverage:
    schema-uri:
      geonames: https://www.geonames.org/
      openstreetmap: https://www.openstreetmap.org/
  validation:
    geonames:
      username: geonames
  uri-validation:
    # Bounded connect/read timeouts for the URI validators' RestTemplate so a slow
    # or unreachable external resolver fails gracefully rather than hanging. Scoped
    # to validators only; the shared RestTemplate (minting etc.) is unaffected (RAID-802).
    connect-timeout: 5s
    read-timeout: 10s
    web-archive:
      availability-url: https://archive.org/wayback/available
  history:
    baseline-interval: 50
server:
  forward-headers-strategy: native
spring:
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${raid.db.host}:${raid.db.port}/${raid.db.name}?currentSchema=${spring.flyway.default-schema}
    username: ${raid.db.user}
    password: ${raid.db.password}
  jooq:
    sql-dialect: postgres
  flyway:
    default-schema: api_svc
    create-schemas: true
    baseline-version: 25
    locations:  classpath:db/env/api_user,classpath:db/migration,classpath:db/env/${raid.environment}
  security:
    oauth2:
      resourceserver:
        jwt:
            issuer-uri: ${raid.iam.realm-uri}
      client:
        registration:
          keycloak:
            client-id: raid-api-2
            authorization-grant-type: authorization_code
            scope: openid
        provider:
          keycloak:
            issuer-uri: ${raid.iam.realm-uri}
            user-name-attribute: preferred_username
springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    path: /docs
datacite:
  endpoint: https://api.test.datacite.org/dois
  registration-agency-name: Australian Research Data Commons