    access-token: 32cacfb3-6dab-4554-ae51-22efd37a2463
  ror-client:
    client-id: 08VB3D1YYHC63CQ8QHP0TBD0I6RULCHQ
    base-url: http://localhost:1080/v2/
  db:
    user: postgres
    password: supersecret
    host: localhost
    port: 7432
    name: raido
    encryption-key: pB7MB3iuYmmjWMTOCK6HS0JetzWhCtBtKoNl39pBr3Q=
  iam:
    realm-uri: http://localhost:8001/realms/raid
  raid-permissions:
    client-id: raid-permissions-admin
    client-secret: 07ATOSG9hYs8oATcz5wcQAdRuoEsLzEY
  contributor-validation:
    orcid:
      url-prefix: https://sandbox.orcid.org/
      schema-uri: https://sandbox.orcid.org/
  # RAID-809: without these overrides, bootRun -Dspring.profiles.active=dev falls back to the
  # raid.stub.*.enabled=false defaults in application.yaml, so mintRaid validation hits the real
  # external resolvers (hdl.handle.net, scicrunch.org, geonames.org, etc.) instead of the
  # in-memory stubs. That's what both local dev and the PR-Integration-Tests GitHub Actions job
  # use to start the API before running intTest, so the sentinel-based
  # NONEXISTENT_TEST_*/SERVER_ERROR_TEST_* assertions in RelatedObjectIntegrationTest and
  # SpatialCoverageIntegrationTest were being validated against unpredictable real-service
  # responses rather than the deterministic stub behaviour they're written for.
  stub:
    geo-names:
      enabled: true
      delay: 150
    orcid:
      enabled: true
      delay: 150
    apids:
      enabled: true
      delay: 150
    doi:
      enabled: true
      delay: 150
    handle:
      enabled: true
      delay: 150
    rrid:
      enabled: true
      delay: 150
    open-street-map:
      enabled: true
      delay: 150
    isni:
      enabled: true
      delay: 150
    ror:
      enabled: true
      delay: 150
